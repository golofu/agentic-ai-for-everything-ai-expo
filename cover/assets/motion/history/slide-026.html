<script>
const W=1920,H=1080,NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage'),sk=document.getElementById('sk');
const SPEED=2.4; // owner: faster pacing for live teaching
const RM=false; // always animate: Windows 'animation effects off' would otherwise skip the motion
const QT=(()=>{const v=new URLSearchParams(location.search).get('t');return v!==null&&v!==''&&isFinite(+v)?+v:null;})();
let INSTANT=false;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
(function(){const h=document.getElementById('holes');for(let i=0;i<9;i++){const d=document.createElement('div');d.className='hole';d.style.top=(78+i*118)+'px';h.appendChild(d);}})();
let _s=11;function seed(n){_s=n>>>0;}
function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function jr(a){return(rnd()*2-1)*a;}
const f1=v=>v.toFixed(1);
function smooth(p){let d='M'+f1(p[0][0])+' '+f1(p[0][1]);const P=[p[0],...p,p[p.length-1]];
 for(let i=1;i<P.length-2;i++){const a=P[i-1],b=P[i],c=P[i+1],e=P[i+2];
  d+=' C'+f1(b[0]+(c[0]-a[0])/6)+' '+f1(b[1]+(c[1]-a[1])/6)+' '+f1(c[0]-(e[0]-b[0])/6)+' '+f1(c[1]-(e[1]-b[1])/6)+' '+f1(c[0])+' '+f1(c[1]);}
 return d;}
function lineD(x1,y1,x2,y2,j=1.6,bk=.012){const L=Math.hypot(x2-x1,y2-y1)||1,n=Math.max(2,Math.round(L/70)),nx=-(y2-y1)/L,ny=(x2-x1)/L,bow=jr(L*bk),pts=[];
 for(let i=0;i<=n;i++){const t=i/n,end=(i==0||i==n),o=bow*Math.sin(Math.PI*t)+(end?0:jr(j*.6));pts.push([x1+(x2-x1)*t+nx*o+(end?jr(j):0),y1+(y2-y1)*t+ny*o+(end?jr(j):0)]);}
 return smooth(pts);}
function rectD(x,y,w,h,j=2){const o=7;return[lineD(x-3-jr(o),y+jr(j),x+w+3+jr(o),y+jr(j),j),lineD(x+w+jr(j),y-3-jr(o),x+w+jr(j),y+h+3+jr(o),j),lineD(x+w+3+jr(o),y+h+jr(j),x-3-jr(o),y+h+jr(j),j),lineD(x+jr(j),y+h+3+jr(o),x+jr(j),y-3-jr(o),j)].join(' ');}
function ellD(cx,cy,rx,ry,turns=1.1,j=.025){const n=Math.round(30*turns),a0=rnd()*6.283,pts=[];
 for(let i=0;i<=n;i++){const a=a0+i/n*turns*6.283,k=1+jr(j)+(i/n-.5)*.05;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}return smooth(pts);}
function qpts(x1,y1,x2,y2,bend,n){const L=Math.hypot(x2-x1,y2-y1)||1,nx=-(y2-y1)/L,ny=(x2-x1)/L,cx=(x1+x2)/2+nx*bend,cy=(y1+y2)/2+ny*bend,pts=[];
 for(let i=0;i<=n;i++){const t=i/n;pts.push([(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2,(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2]);}return{pts,cx,cy};}
function headD(x2,y2,fx,fy,head){const tx=x2-fx,ty=y2-fy,tl=Math.hypot(tx,ty)||1,ux=tx/tl,uy=ty/tl,a=.48,ca=Math.cos(a),sa=Math.sin(a);
 const h1=[x2-head*(ux*ca-uy*sa),y2-head*(uy*ca+ux*sa)],h2=[x2-head*(ux*ca+uy*sa),y2-head*(uy*ca-ux*sa)];
 return ' M'+f1(h1[0])+' '+f1(h1[1])+' L'+f1(x2+jr(1))+' '+f1(y2+jr(1))+' L'+f1(h2[0])+' '+f1(h2[1]);}
function arrowD(x1,y1,x2,y2,bend=0,head=18){const L=Math.hypot(x2-x1,y2-y1),n=Math.max(3,Math.round(L/60));const q=qpts(x1,y1,x2,y2,bend,n);
 const pts=q.pts.map((p,i)=>(i&&i<n)?[p[0]+jr(1.2),p[1]+jr(1.2)]:p);
 return smooth(pts)+headD(x2,y2,q.cx,q.cy,head);}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||sk).appendChild(e);return e;}
function P(d,o={}){const p=el('path',{d,pathLength:1,class:'ink '+(o.cls||'')},o.g);p.style.stroke=o.c||'#5d518e';p.style.strokeWidth=o.w||3.6;if(o.op)p.style.opacity=o.op;return p;}
function F(d,o={}){const p=el('path',{d,class:'fl'},o.g);p.style.fill=o.c||'#eeeaff';p.style.stroke='none';if(o.id)p.id=o.id;return p;}
function G(id,parent){return el('g',id?{id}:{},parent);}
function sRect(x,y,w,h,o={}){const g=o.g||G(o.id);P(rectD(x,y,w,h),{...o,g});if(!o.single)P(rectD(x+1,y+1,w-2,h-2,2.6),{...o,g,w:(o.w||3.6)*.5,op:.5});return g;}
function sEll(cx,cy,rx,ry,o={}){const g=o.g||G(o.id);P(ellD(cx,cy,rx,ry,o.turns||1.12),{...o,g});return g;}
function sArrow(x1,y1,x2,y2,o={}){const g=o.g||G(o.id);P(arrowD(x1,y1,x2,y2,o.bend||0,o.head||18),{...o,g});return g;}
function sLine(x1,y1,x2,y2,o={}){const g=o.g||G(o.id);P(lineD(x1,y1,x2,y2,o.j||1.6,o.bk??.012),{...o,g});return g;}
function starPts(cx,cy,r){const p=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;p.push([cx+Math.cos(a)*rr+jr(1.2),cy+Math.sin(a)*rr+jr(1.2)]);}return p;}
function polyD(p){return 'M'+p.map(q=>f1(q[0])+' '+f1(q[1])).join(' L')+' Z';}
function $(s){return typeof s=='string'?[...stage.querySelectorAll(s)]:(Array.isArray(s)?s:[s]);}
function on(s){$(s).forEach(e=>e&&e.classList.add('on'));}
function draw(s,dur=.8){const paths=[];$(s).forEach(e=>{if(!e)return;if(e.tagName=='path')paths.push(e);else paths.push(...e.querySelectorAll('path.ink'));});
 let tot=0;const L=paths.map(p=>{let l=1;try{l=Math.max(20,p.getTotalLength());}catch(_){}tot+=l;return l;});let acc=0;
 paths.forEach((p,i)=>{const d=dur*L[i]/tot;p.style.setProperty('--d',(d/SPEED).toFixed(3)+'s');p.style.setProperty('--dl',(dur*acc/tot/SPEED).toFixed(3)+'s');acc+=L[i];p.classList.add('on');});}
const TL=[],hooks=[];let timers=[];
function at(t,f){TL.push([t,f]);}
function onReset(f){hooks.push(f);}
function every(f,ms){const id=setInterval(f,ms);timers.push(id);return id;}
function resetAll(){timers.forEach(id=>{clearTimeout(id);clearInterval(id);});timers=[];stage.classList.add('noanim');
 stage.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));hooks.forEach(f=>f());void stage.offsetWidth;}
/* plays once, then holds the final state (no loop) */
function play(freezeAt){resetAll();
 if(freezeAt!=null){INSTANT=true;TL.slice().sort((a,b)=>a[0]-b[0]).forEach(([t,f])=>{if(t<=freezeAt)f();});return;}
 INSTANT=false;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{stage.classList.remove('noanim');
  TL.forEach(([t,f])=>timers.push(setTimeout(f,t*1000/SPEED)));}));}
const graph=s=>[...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(s)].map(x=>x.segment);
function typeSeq(segs,dur){const all=[];segs.forEach(([e,txt])=>{e.textContent='';graph(txt).forEach(g=>all.push([e,g]));});
 if(INSTANT||!all.length){segs.forEach(([e,txt])=>e.textContent=txt);return;}
 let i=0;const id=every(()=>{const[e,g]=all[i++];e.textContent+=g;if(i>=all.length)clearInterval(id);},dur*1000/SPEED/all.length);}
function bx(e){const s=stage.getBoundingClientRect(),r=e.getBoundingClientRect(),k=s.width/W;return{x:(r.left-s.left)/k,y:(r.top-s.top)/k,w:r.width/k,h:r.height/k};}
/* photo crops taken from the original slide PNG */
function setupCuts(){stage.querySelectorAll(".cut").forEach(c=>{const [x,y,w,h]=c.dataset.r.split(",").map(Number),iw=+c.dataset.iw,ih=+c.dataset.ih,dw=+c.dataset.w,k=dw/w;
 c.style.width=dw+"px";c.style.height=Math.round(h*k)+"px";c.style.backgroundImage='url("'+c.dataset.src+'")';
 c.style.backgroundSize=(iw*k).toFixed(1)+"px "+(ih*k).toFixed(1)+"px";c.style.backgroundPosition=(-x*k).toFixed(1)+"px "+(-y*k).toFixed(1)+"px";});}
function setupPhotos(){stage.querySelectorAll('.photo').forEach((ph,i)=>{const [x,y,w,h]=ph.dataset.r.split(',').map(Number),iw=+ph.dataset.iw,ih=+ph.dataset.ih,dw=+ph.dataset.w,k=dw/w;
 const im=ph.querySelector('.img');im.style.width=dw+'px';im.style.height=Math.round(h*k)+'px';im.style.backgroundImage='url("'+ph.dataset.src+'")';
 im.style.backgroundSize=(iw*k).toFixed(1)+'px '+(ih*k).toFixed(1)+'px';im.style.backgroundPosition=(-x*k).toFixed(1)+'px '+(-y*k).toFixed(1)+'px';
 const fw=dw+24,fh=Math.round(h*k)+26,sv=el('svg',{class:'pframe',width:fw+28,height:fh+28,viewBox:'0 0 '+(fw+28)+' '+(fh+28)},ph);ph.insertBefore(sv,ph.firstChild);
 seed(90+i);P(rectD(6,6,fw+16,fh+16,2.2),{g:sv,w:3,c:'#5d518e'});P(rectD(8,8,fw+12,fh+12,2.6),{g:sv,w:1.6,c:'#8d80ca',op:.6});});}
document.getElementById('replay').addEventListener('click',()=>play(null));
function start(){const go=()=>{if(start.done)return;start.done=1;setupPhotos();setupCuts();build();play(RM?1e9:QT);};(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go);setTimeout(go,2500);}

/* ---------- scene ---------- */
const CARDS=[
 ['blush','ปัญญาด้านภาษา','Linguistic','โดดเด่นด้านการใช้คำพูด การอ่าน เขียน และการสื่อสารเพื่อโน้มน้าวใจ'],
 ['mint','ปัญญาด้านตรรกะ|และคณิตศาสตร์','Logical-Mathematical','เน้นการวิเคราะห์ แก้ปัญหา {การคำนวณ} และความสัมพันธ์เชิงตรรกะทางวิทยาศาสตร์'],
 ['sky','ปัญญาด้าน|มิติสัมพันธ์','Visual-Spatial','ความสามารถในการจินตนาการภาพ พื้นที่ รูปทรง และ{ทักษะด้านการออกแบบ}'],
 ['lav','ปัญญาด้านดนตรี','Musical','ความไวต่อจังหวะ เสียง และโทน เพื่อสร้างสรรค์อารมณ์ผ่านสุนทรียภาพทางดนตรี'],

<script>/* thai-letter-spacing-guard */
(() => {
  const thai = /[\u0E00-\u0E7F]/;
  for (const el of document.querySelectorAll("body *")) {
    const ownText = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join("");
    if (!thai.test(ownText)) continue;
    if (parseFloat(getComputedStyle(el).letterSpacing) > 0) el.style.letterSpacing = "normal";
  }
})();
