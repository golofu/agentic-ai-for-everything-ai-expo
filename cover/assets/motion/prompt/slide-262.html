<!doctype html><html lang="th"><head><!-- space-skin --><script>// Inlined into each copied slide (scripts/apply-space-skin.py).
// Slides keep their original light course colours for readability; the space theme lives in the viewer around them.
// Copied pages keep a <base href> to their source site, so URL updates there would throw: swallow those.
(() => {
  for (const name of ["replaceState", "pushState"]) {
    const original = history[name].bind(history);
    history[name] = (...args) => { try { return original(...args); } catch (error) { return undefined; } };
  }
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สรุปการ Prompt แบบภาษาคน</title><link rel="stylesheet" href="summary.css"><style>#stage.title-card{padding:0;display:grid;place-items:center}h1{margin:0;width:1700px;text-align:center;font-size:144px;font-weight:700;line-height:1.5;letter-spacing:normal}h1 span{color:var(--purple)}</style></head><body><main id="stage" class="title-card"><h1>สรุปการ Prompt<br><span>แบบภาษาคน</span></h1></main><script>function fit(){document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',fit);fit();</script></body></html>
