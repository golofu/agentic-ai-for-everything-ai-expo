<!doctype html>
<html lang="th">
<head><!-- space-skin --><script>// Inlined into each copied slide (scripts/apply-space-skin.py).
// Slides keep their original light course colours for readability; the space theme lives in the viewer around them.
// Copied pages keep a <base href> to their source site, so URL updates there would throw: swallow those.
(() => {
  for (const name of ["replaceState", "pushState"]) {
    const original = history[name].bind(history);
    history[name] = (...args) => { try { return original(...args); } catch (error) { return undefined; } };
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download Skill · ตัวอย่างใช้งานจริง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Manrope:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfcff;--ink:#1d2230;--muted:#656d7f;--violet:#8d80ca;--vd:#5d518e;--lav:#eeeaff;--blush:#ffeaf0;--mint:#e7f8f0;--sky:#e8f4ff;--or:#f05a28}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:'Noto Sans Thai','Manrope',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;transform:translate(-50%,-50%);overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,250,240,.7),transparent 60%),repeating-linear-gradient(180deg,transparent 0 58px,rgba(141,128,202,.13) 58px 60px),var(--paper)}
.margin{position:absolute;top:0;bottom:0;left:126px;width:7px;border-left:2px solid rgba(240,90,40,.22);border-right:1.5px solid rgba(240,90,40,.13)}
.hole{position:absolute;left:44px;width:26px;height:26px;border-radius:50%;background:#e4e1ec;box-shadow:inset 2px 3px 4px rgba(40,30,80,.22),0 1px 0 rgba(255,255,255,.9)}
/* header */
.num{position:absolute;left:180px;top:36px;font:800 34px Manrope,sans-serif;color:#fff;background:var(--vd);border-radius:12px;padding:2px 16px}
h1{position:absolute;left:270px;top:26px;font:800 50px/1.3 Manrope,'Noto Sans Thai',sans-serif;white-space:nowrap}
.sub{position:absolute;left:180px;top:98px;font-size:26px;color:var(--muted)}
/* steps rail */
.rail{position:absolute;left:180px;top:150px;width:470px;display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;padding:14px 18px;border-radius:18px;background:#fff;border:2px solid #e6e2f3;opacity:.35;transform:translateX(-10px);transition:opacity .35s,transform .45s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .3s}
.step.on{opacity:1;transform:none}
.step.now{border-color:var(--or);box-shadow:0 0 0 6px rgba(240,90,40,.12)}
.step i{font-style:normal;width:52px;height:52px;border-radius:50%;background:var(--lav);color:var(--vd);display:flex;align-items:center;justify-content:center;font:800 26px Manrope,sans-serif}
.step b{display:block;font-size:26px;line-height:1.35}
.step span{display:block;font-size:21px;color:var(--muted);line-height:1.45;margin-top:2px}
.step code{font-family:'Noto Sans Thai',sans-serif;font-size:21px;background:var(--lav);color:var(--vd);border-radius:8px;padding:1px 8px}
/* screen */
.screen{position:absolute;left:690px;top:160px;width:1110px;height:562px;border-radius:18px;background:#fff;border:2px solid #ded9ef;box-shadow:0 18px 40px rgba(40,30,80,.14);overflow:hidden}
.bar{height:34px;background:#f1eff8;display:flex;align-items:center;gap:8px;padding-left:14px;font:600 16px Manrope,sans-serif;color:var(--muted)}
.bar i{width:11px;height:11px;border-radius:50%;background:#d9d5e8;display:inline-block}
.view{position:absolute;left:0;top:34px;right:0;bottom:0;overflow:hidden;background:#fff}
#frames{position:absolute;inset:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.fr{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;object-position:center top;opacity:0;transition:opacity .45s}
.fr.on{opacity:1}
.speed{position:absolute;right:14px;top:44px;z-index:3;font:700 18px Manrope,'Noto Sans Thai',sans-serif;color:#fff;background:rgba(29,34,48,.72);border-radius:20px;padding:4px 14px;opacity:0;transition:opacity .3s}
.speed.on{opacity:1}
.call{position:absolute;z-index:4;font:700 24px/1.35 'Noto Sans Thai',sans-serif;color:#fff;background:var(--or);border-radius:14px;padding:8px 18px;box-shadow:0 8px 18px rgba(240,90,40,.3);opacity:0;transform:scale(.7);transition:opacity .25s,transform .35s cubic-bezier(.22,1,.36,1);max-width:520px}
.call.on{opacity:1;transform:none}
.ring{position:absolute;z-index:4;border:5px solid var(--or);border-radius:16px;box-shadow:0 0 0 8px rgba(240,90,40,.14);opacity:0;transition:opacity .25s}
.ring.on{opacity:1}
/* prompt strip */
.prompt{position:absolute;left:690px;top:750px;width:1110px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:#fff;border:2px solid #ded9ef;border-radius:18px;padding:14px 20px}
.prompt .lab{font:700 20px 'Noto Sans Thai',sans-serif;color:#fff;background:var(--vd);border-radius:10px;padding:4px 12px;white-space:nowrap}
.prompt p{font-size:26px;line-height:1.5;white-space:pre-wrap;max-height:160px;overflow:hidden}
.copy{font:600 22px 'Noto Sans Thai',sans-serif;background:#fff;color:var(--vd);border:2px solid #5d518e55;border-radius:12px;padding:10px 20px;cursor:pointer;white-space:nowrap}
.copy:hover,.copy:focus-visible{background:var(--vd);color:#fff}
.note{position:absolute;left:690px;top:950px;width:1110px;width:1620px;font-size:19px;color:var(--muted);line-height:1.5}
#replay{position:absolute;right:38px;bottom:24px;z-index:9;padding:8px 18px;font:20px/1.2 'Itim','Noto Sans Thai',cursive;color:var(--vd);background:rgba(251,252,255,.85);border:2px solid rgba(93,81,142,.55);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;cursor:pointer;opacity:.5}
#replay:hover,#replay:focus-visible{opacity:1}
.noanim *{transition:none!important}
</style>
</head>
<body>
<main id="stage">
  <div class="margin"></div>
  <div class="num">03</div>
  <h1>Download Skill</h1>
  <p class="sub">โหลดไฟล์ Skill (.zip) ที่คนอื่นทำไว้ แล้วอัปโหลดเข้า Claude Desktop</p>
  <section class="rail" id="rail"></section>
  <section class="screen">
    <div class="bar"><i></i><i></i><i></i>&nbsp;Claude · ภาพจริงจากการใช้งาน</div>
    <div class="view" id="view">
      <div id="frames"><img class="fr on" src="media/demo-create-3-f1.jpg" alt=""><img class="fr" src="media/demo-create-3-f2.jpg" alt=""><img class="fr" src="media/demo-create-3-f3.jpg" alt=""><img class="fr" src="media/demo-create-3-f4.jpg" alt=""><img class="fr" src="media/demo-create-3-f5.jpg" alt=""><img class="fr" src="media/demo-create-3-f6.jpg" alt=""><img class="fr" src="media/demo-create-3-f7.jpg" alt=""></div>
    </div>
    <div class="speed" id="speed">AI กำลังทำงาน · ข้ามเวลา ⏩</div>
  </section>
  <section class="prompt"><span class="lab">ทางเข้า</span><p id="prompt-text">Customize &gt; Add &gt; Upload skill &gt; เลือกไฟล์ .zip &gt; Upload</p><button class="copy" type="button" id="copy">คัดลอก Prompt</button></section>
  <p class="note">ภาพจริงจาก Claude Desktop · ข้อมูลตัวอย่าง · ตัวอย่าง document-reader-direct</p>
  <button id="replay" type="button">เล่นใหม่</button>
</main>
<script>
function fit(){document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',fit);fit();
// CUES: steps = rail cards; events (t in video seconds): {t, step} highlights a step, {t, zoom:[scale,x,y]} zooms the screen
// (x,y = top-left of the visible area in screen pixels of the 1110x660 view), {t, call:"text", at:[x,y]}, {t, ring:[x,y,w,h]},
// {t, speed:true|false}, {t, clear:true} removes callouts/rings.
const CUES={"steps": [{"b": "เข้าคลัง Skill", "s": "ใส่รหัสผ่านจากในคลาส แล้วโหลดไฟล์ .zip"}, {"b": "Customize แล้วกด Add", "s": "เลือก <code>Upload skill</code>"}, {"b": "เลือกไฟล์ .zip", "s": "ตรวจชื่อ Skill แล้วกด <code>Upload</code>"}, {"b": "เรียกใช้ในแชทใหม่", "s": "พิมพ์ <code>/</code> แล้วเลือกชื่อ Skill"}], "events": [{"t": 0.4, "clear": true, "ring": [464.1, 280.7, 177.8, 30.8], "frame": 0, "zoom": [1.8, 245.8, 117.3], "step": 0}, {"t": 0.9, "call": "ใส่รหัสผ่านที่ได้รับในคลาส", "at": [256.9, 334.0]}, {"t": 2.8, "clear": true, "ring": [446.0, 148.7, 215.1, 231.2], "zoom": [1.8, 245.8, 117.3], "step": 0}, {"t": 3.3, "call": "แล้วดาวน์โหลดไฟล์ .zip ของ Skill", "at": [268.0, 339.5]}, {"t": 5.4, "clear": true, "ring": [823.5, 72.3, 49.6, 21.8], "frame": 1, "zoom": [2, 371.1, 0], "step": 1, "type": true}, {"t": 5.9, "call": "เปิด Customize แล้วกด Add", "at": [561.1, 95.0]}, {"t": 7.6, "clear": true, "ring": [783.7, 94.2, 84.6, 19.1], "zoom": [2, 371.1, 0], "step": 1}, {"t": 8.1, "call": "เลือก Upload skill", "at": [611.1, 150.0]}, {"t": 10.0, "clear": true, "ring": [373.4, 130.5, 499.2, 66.0], "frame": 2, "zoom": [2, 344.8, 30.0], "step": 2}, {"t": 10.5, "call": "ลากไฟล์ .zip มาวาง หรือกด browse", "at": [373.4, 204.5]}, {"t": 12.6, "clear": true, "ring": [372, 130, 500, 32], "frame": 3, "zoom": [1.8, 300, 90], "step": 2}, {"t": 13.1, "call": "เลือกไฟล์ .zip ที่โหลดมา", "at": [380, 176]}, {"t": 14.8, "clear": true, "ring": [372, 346, 44, 20], "zoom": [1.8, 300, 90], "step": 2}, {"t": 15.3, "call": "ตรวจชื่อ Skill แล้วกด Upload", "at": [440, 322]}, {"t": 17.2, "clear": true, "ring": [374.5, 73.2, 499.5, 53.3], "frame": 4, "zoom": [2, 346.5, 0], "step": 2}, {"t": 17.7, "call": "ติดตั้งแล้ว สวิตช์เปิด มี 9 ไฟล์", "at": [374.5, 134.5]}, {"t": 19.8, "clear": true, "ring": [383.1, 191.4, 125.3, 20.0], "frame": 5, "zoom": [2.4, 285.8, 108.9], "step": 3}, {"t": 20.3, "call": "พิมพ์ / แล้วเลือกชื่อ Skill", "at": [381.6, 156.8]}, {"t": 22.2, "clear": true, "ring": [433.2, 34.1, 312.1, 28.6], "frame": 6, "zoom": [2, 284.7, 0], "step": 3}, {"t": 22.7, "call": "เลือก Skill แล้วพิมพ์ข้อความต่อ", "at": [433.2, 70.7]}, {"t": 24.6, "clear": true, "ring": [362.7, 94.8, 368.2, 83.2], "zoom": [2, 284.7, 22.4], "step": 3, "final": true}, {"t": 25.1, "call": "Claude ใช้ Skill ตรวจให้ พบคำผิด 1 จุด", "at": [534.7, 84.9], "final": true}]};
// frames-based timeline: events {t (s), frame:i, zoom:[k,x,y], call:"..", at:[x,y], ring:[x,y,w,h], step:i, speed:bool, clear:true, type:true}
const $=s=>document.querySelector(s), stage=$('#stage'), view=$('#view'), box=$('#frames'), frames=[...document.querySelectorAll('.fr')];
const rail=$('#rail');
CUES.steps.forEach((s,i)=>{const d=document.createElement('div');d.className='step';d.innerHTML='<i>'+(i+1)+'</i><div><b>'+s.b+'</b><span>'+s.s+'</span></div>';rail.appendChild(d)});
const steps=[...rail.children], ptxt=$('#prompt-text'), FULL=ptxt.textContent;
let timers=[];
let cz=[1,0,0];
function zoom(z){cz=z;const [k,x,y]=z;box.style.transform='translate('+(-x*k)+'px,'+(-y*k)+'px) scale('+k+')';}
function show(i){frames.forEach((f,j)=>f.classList.toggle('on',j===i));}
function typeIt(){const g=[...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(FULL)].map(x=>x.segment);ptxt.textContent='';let i=0;const id=setInterval(()=>{ptxt.textContent+=g[i++]||'';if(i>=g.length)clearInterval(id)},Math.max(18,1400/g.length));timers.push(id);}
function overlay(e){
  if(e.clear)stage.querySelectorAll('.call,.ring').forEach(n=>n.remove());
  if(e.frame!==undefined)show(e.frame);
  if(e.zoom)zoom(e.zoom);
  if(e.type)typeIt();
  // call/ring coords are in un-zoomed view pixels; they follow the current zoom
  if(e.call){const c=document.createElement('div');c.className='call';c.textContent=e.call;const [k,x,y]=cz;c.style.left=Math.max(8,Math.min(1106-300,(e.at[0]-x)*k))+'px';c.style.top=Math.max(8,Math.min(470,(e.at[1]-y)*k))+'px';view.appendChild(c);requestAnimationFrame(()=>c.classList.add('on'));}
  if(e.ring){const r=document.createElement('div');r.className='ring';Object.assign(r.style,{left:e.ring[0]+'px',top:e.ring[1]+'px',width:e.ring[2]+'px',height:e.ring[3]+'px',borderWidth:(5/cz[0])+'px',borderRadius:(14/cz[0])+'px',boxShadow:'0 0 0 '+(7/cz[0])+'px rgba(240,90,40,.14)'});box.appendChild(r);requestAnimationFrame(()=>r.classList.add('on'));}
  if(e.speed!==undefined)$('#speed').classList.toggle('on',!!e.speed);
  if(e.step!==undefined)steps.forEach((s,i)=>{s.classList.toggle('on',i<=e.step);s.classList.toggle('now',i===e.step)});
}
function reset(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];stage.querySelectorAll('.call,.ring').forEach(n=>n.remove());zoom([1,0,0]);show(0);steps.forEach(s=>s.classList.remove('on','now'));$('#speed').classList.remove('on');ptxt.textContent=FULL;}
function play(){reset();CUES.events.forEach(e=>timers.push(setTimeout(()=>overlay(e),e.t*1000)));}
const frozen=new URLSearchParams(location.search).has('t');
if(frozen){document.body.classList.add('noanim');reset();CUES.events.forEach(e=>{if(e.final||e.frame!==undefined||e.zoom||e.step!==undefined){const f={...e};delete f.type;delete f.call;delete f.ring;overlay(f)}});CUES.events.filter(e=>e.final).forEach(overlay);steps.forEach(s=>s.classList.add('on'));$('#speed').classList.remove('on');}
else{
  // start only after fonts and every frame image are ready, so rings never land on a blank screen
  const imgs=frames.map(f=>f.complete?Promise.resolve():new Promise(r=>{f.addEventListener('load',r,{once:true});f.addEventListener('error',r,{once:true})}));
  Promise.all([document.fonts?document.fonts.ready:Promise.resolve(),...imgs]).then(play);
}
$('#replay').addEventListener('click',()=>{document.body.classList.remove('noanim');play()});
$('#copy').addEventListener('click',async()=>{const text=$('#prompt-text').textContent;let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-9999px';document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch(_){}t.remove()}$('#copy').textContent=ok?'คัดลอกแล้ว':'คัดลอกไม่สำเร็จ';setTimeout(()=>$('#copy').textContent='คัดลอก Prompt',2200)});
</script>
</body>
</html>
