">Research</text><rect x="180" y="212" width="242.9" height="26" fill="#28776d" rx="1"/><text x="431.9" y="231" font-size="15" text-anchor="start" fill="#243b36">24</text><text x="168" y="276" font-size="15" text-anchor="end" fill="#243b36">Email</text><rect x="180" y="259" width="182.2" height="26" fill="#28776d" rx="1"/><text x="371.2" y="278" font-size="15" text-anchor="start" fill="#243b36">18</text><text x="168" y="323" font-size="15" text-anchor="end" fill="#243b36">File sorting</text><rect x="180" y="306" width="101.2" height="26" fill="#28776d" rx="1"/><text x="290.2" y="325" font-size="15" text-anchor="start" fill="#243b36">10</text><text x="180" y="455" font-size="15" text-anchor="start" fill="#243b36">Start at 0; rank categories from largest to smallest</text></g></svg>