<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="title desc"><title id="title">3D Area Chart</title><desc id="desc">Original practice chart. คำขอแต่ละช่องทางมีช่วงที่หนาแน่นต่างกันหรือไม่? hour,Chat,Email,Phone; 09:00,10,8,5; 10:00,18,12,8; 11:00,24,10,6; 12:00,12,6,4; 13:00,20,9,7</desc><rect width="780" height="560" rx="18" fill="#fbfdfb"/><g font-family="Tahoma, sans-serif"><text x="32" y="35" font-size="19" text-anchor="start" fill="#243b36">14 / 3D Area Chart</text><text x="40" y="82" font-size="16" text-anchor="start" fill="#243b36">X = hour · Depth = channel · Height = requests</text><polygon points="253,292 253,262 356,244 459,256 562,268 665,250 665,292" fill="#6878ac" fill-opacity="0.58" stroke="white" stroke-width="1.5"/><polyline points="253,262 356,244 459,256 562,268 665,250" fill="none" stroke="#6878ac" stroke-width="3" stroke-linejoin="round"/><text x="253" y="252.4" font-size="13" text-anchor="middle" fill="#243b36">5</text><text x="356" y="234.4" font-size="13" text-anchor="middle" fill="#243b36">8</text><text x="459" y="246.4" font-size="13" text-anchor="middle" fill="#243b36">6</text><text x="562" y="258.4" font-size="13" text-anchor="middle" fill="#243b36">4</text><text x="665" y="240.4" font-size="13" text-anchor="middle" fill="#243b36">7</text><text x="716.5" y="292" font-size="14" text-anchor="start" fill="#243b36">Phone</text><line x1="253" y1="292" x2="665" y2="292" stroke="#a4b7af" /><polygon points="189,335 189,287 292,263 395,275 498,299 601,281 601,335" fill="#e09160" fill-opacity="0.58" stroke="white" stroke-width="1.5"/><polyline points="189,287 292,263 395,275 498,299 601,281" fill="none" stroke="#e09160" stroke-width="3" stroke-linejoin="round"/><text x="189" y="277.4" font-size="13" text-anchor="middle" fill="#243b36">8</text><text x="292" y="253.4" font-size="13" text-anchor="middle" fill="#243b36">12</text><text x="395" y="265.4" font-size="13" text-anchor="middle" fill="#243b36">10</text>