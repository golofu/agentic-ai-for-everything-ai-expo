  <script>
    const workshopPrompts = [
      {
        title: "1. วางแผนคอนเทนต์รายเดือน",
        prompt: `คุณเป็น Content Strategist ของแบรนด์ [ชื่อแบรนด์]\n\nผมต้องการทำแผนคอนเทนต์ 30 วัน\nสินค้า/บริการ: [ใส่]\nกลุ่มเป้าหมาย: [ใส่]\nเป้าหมาย: [สร้างการรับรู้/ยอดขาย/ลูกค้าใหม่]\nโทน: [ใส่]\n\nสร้างตาราง 30 วัน แบ่งเป็น ความรู้ / โปรโมชัน / ไลฟ์สไตล์ / ชวนมีส่วนร่วม พร้อมหัวข้อโพสต์ Hook และ CTA ของแต่ละวัน`
      },
      {
        title: "2. สกัด Insight ลูกค้า",
        prompt: `คุณเป็นนักวิจัย Consumer Insight\n\nวิเคราะห์ข้อมูลลูกค้าด้านล่าง\n[วางรีวิว แบบสอบถาม หรือบทสนทนา]\n\nสรุปเป็น 1) Pain 2) Gain 3) ความต้องการที่ยังไม่ได้รับการตอบสนอง 4) Key message ที่ควรสื่อสาร\nตอบเป็นตาราง พร้อมยกข้อความจากข้อมูลที่สนับสนุนแต่ละข้อ`
      },
      {
        title: "3. เขียนข้อเสนอโครงการ",
        prompt: `คุณเป็น Project Manager\n\nผมต้องการทำโครงการ [ชื่อโครงการ]\nปัญหาที่ต้องแก้: [ใส่]\nผลลัพธ์ที่ต้องการ: [ใส่]\nผู้เกี่ยวข้อง: [ใส่]\nกรอบเวลา: [ใส่]\n\nเขียน Project Proposal แบบกระชับ มี วัตถุประสงค์ ขอบเขต แผนงานรายสัปดาห์ ความเสี่ยง และตัวชี้วัดความสำเร็จ`
      },
      {
        title: "4. สรุปประชุมเป็น Action Plan",
        prompt: `คุณเป็นผู้ช่วยสรุปการประชุม\n\nอ่านบันทึกประชุมด้านล่าง\n[วางบันทึกประชุม]\n\nสรุปเฉพาะ 1) ข้อตกลง 2) งานที่ต้องทำ 3) เจ้าของงาน 4) กำหนดส่ง 5) ประเด็นที่ยังต้องตัดสินใจ\nจัดเป็นตาราง Action Plan และระบุคำถามติดตามที่จำเป็น`
      },
      {
        title: "5. เตรียมคำถามคุยกับลูกค้า",
        prompt: `คุณเป็น Sales Consultant\n\nผมกำลังจะคุยกับลูกค้าประเภทธุรกิจ [ใส่]\nสินค้าที่นำเสนอ: [ใส่]\nสิ่งที่รู้เกี่ยวกับลูกค้า: [ใส่]\n\nออกแบบคำถาม Discovery 12 ข้อ เรียงจากการเปิดบทสนทนา ไปสู่ปัญหา งบประมาณ ผู้ตัดสินใจ และขั้นตอนถัดไป พร้อมเหตุผลสั้น ๆ ว่าแต่ละคำถามใช้ค้นหาอะไร`
      },
      {
        title: "6. สร้าง Job Description",
        prompt: `คุณเป็น HR Business Partner\n\nช่วยเขียน Job Description สำหรับตำแหน่ง [ชื่อตำแหน่ง]\nทีม/ธุรกิจ: [ใส่]\nเป้าหมายของตำแหน่ง: [ใส่]\nงานหลักที่ต้องรับผิดชอบ: [ใส่]\n\nจัดผลลัพธ์เป็น ภารกิจของตำแหน่ง หน้าที่หลัก คุณสมบัติจำเป็น คุณสมบัติเพิ่มเติม และเกณฑ์สัมภาษณ์ 6 ข้อ`
      },
      {
        title: "7. ให้ Feedback ผลงาน",
        prompt: `คุณเป็นหัวหน้าทีมที่ให้ Feedback อย่างตรงไปตรงมาและเคารพผู้รับ\n\nผลงานหรือพฤติกรรมที่ต้องการสะท้อน: [ใส่]\nผลกระทบที่เกิดขึ้น: [ใส่]\nสิ่งที่อยากให้เกิดขึ้นต่อไป: [ใส่]\n\nเขียนบทสนทนา Feedback ตามโครงสร้าง Situation - Behavior - Impact - Next step พร้อมประโยคเปิดและคำถามชวนให้พนักงานคิดต่อ`
      },
      {
        title: "8. ออกแบบ Workshop",
        prompt: `คุณเป็น Learning Designer\n\nออกแบบ Workshop เรื่อง [หัวข้อ]\nผู้เรียน: [ใส่]\nพื้นฐานเดิม: [ใส่]\nเวลา: [ใส่]\nผลลัพธ์หลังเรียน: [ใส่]\n\nจัด Agenda เป็นช่วงเวลา พร้อมกิจกรรมลงมือทำ คำถามชวนคิด อุปกรณ์ที่ต้องใช้ และวิธีประเมินว่าผู้เรียนทำได้จริง`
      },
      {
        title: "9. เขียน SOP งานประจำ",
        prompt: `คุณเป็น Operations Specialist\n\nช่วยเปลี่ยนขั้นตอนทำงานนี้ให้เป็น SOP\n[วางขั้นตอนเดิมหรืออธิบายงาน]\n\nเขียนเป็น ขั้นตอนก่อนเริ่มงาน ลำดับการทำงาน จุดตรวจคุณภาพ ข้อยกเว้น ผู้รับผิดชอบ และ Checklist ท้ายเอกสาร โดยใช้ภาษาที่คนเริ่มงานใหม่ทำตามได้`
      },
      {
        title: "10. วิเคราะห์ผลแบบสอบถาม",
        prompt: `คุณเป็น Data Analyst\n\nวิเคราะห์ผลแบบสอบถามนี้\n[วางตารางข้อมูลหรือสรุปคำตอบ]\n\nบอก 1) รูปแบบที่พบ 2) กลุ่มที่มีความเห็นต่าง 3) ประเด็นเร่งด่วน 4) ข้อเสนอแนะที่ทำได้ภายใน 30 วัน\nแสดงผลเป็นตาราง และแยกสิ่งที่ข้อมูลยืนยันได้ออกจากข้อสันนิษฐาน`
      },

    const motionAssetRevision = "20261029-install-skill-3";

    function motionPath(file) {
      return `assets/motion/${file}?rev=${motionAssetRevision}`;
    }

    // Built by scripts/build-motion-thumbs.js: why/slide-006.html -> why/thumbs/slide-006.jpg
    function thumbPath(page) {
      if (!page.motion) return slidePath(page.page, page.assetSet);
      const thumb = page.motion.replace(/([^/]+)\.html$/, "thumbs/$1.jpg");
      return `assets/motion/${thumb}?rev=${motionAssetRevision}`;
    }

    function showSlideMotion(page, title) {
      const src = page.motion ? motionPath(page.motion) : "";
      slideMotion.hidden = !src;
      if (!src) {
        if (slideMotion.getAttribute("src")) slideMotion.removeAttribute("src");
        return;
      }
      slideMotion.title = title;
      slideMotion.src = src;
    }

    // A motion page can ask the viewer to jump to another slide of the same lesson
    // (the department tiles on slide 235 do this): postMessage({ type: "goToPage", page: 236 }).
    window.addEventListener("message", event => {
      if (!activeLesson || event.source !== slideMotion.contentWindow) return;
      const data = event.data;
      if (!data || data.type !== "goToPage") return;
      const pages = lessonPages(lessons[activeLesson]);
      const index = pages.findIndex(page => page.type === "slide" && page.page === Number(data.page));
      if (index >= 0) showSlide(index);
    });

    // Arrow keys pressed while the motion page has focus still drive the viewer.
    slideMotion.addEventListener("load", () => {
      try {
        slideMotion.contentWindow.addEventListener("keydown", event => {
          const forwarded = new KeyboardEvent("keydown", { key: event.key, shiftKey: event.shiftKey, bubbles: true, cancelable: true });
          document.dispatchEvent(forwarded);
          if (forwarded.defaultPrevented) event.preventDefault();
        });
      } catch {
        // A cross-origin motion page keeps its own keyboard handling.
      }
    });

    // A lesson with `motionDir` plays assets/motion/<motionDir>/<name>.html for each slide,
    // where <name> is `slide-NNN`, or `<last assetSet segment>-NNN` for slides from an asset set.
    function motionFileFor(lesson, page) {
      if (page.type !== "slide" || page.motion || !lesson.motionDir) return page.motion;
      if (lesson.motionSkip?.includes(page.page)) return undefined;
      const prefix = page.assetSet ? page.assetSet.split("/").pop() : "slide";
      return `${lesson.motionDir}/${prefix}-${String(page.page).padStart(3, "0")}.html`;
    }

      let pages = lesson.pages ?? lesson.slides.map(page => ({ type: "slide", page }));
      if (lesson.motionDir) {
        pages = pages.map(page => {
          const motion = motionFileFor(lesson, page);
          return motion ? { ...page, motion } : page;
        });

      const key = Object.keys(lessons).find(name => lessons[name] === lesson);
      const recap = recapVideoByLesson[key];
      return recap ? [...pages, { type: "recap-video", label: "คลิปสรุปเนื้อหา", file: recap }] : pages;

    async function copyText(text, button) {
      const previousFocus = document.activeElement;
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.append(textarea);
      textarea.focus();
      textarea.select();
      let success = document.execCommand("copy");
      textarea.remove();
      if (previousFocus?.isConnected) previousFocus.focus({ preventScroll: true });
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          success = true;
        } catch {}
      }
      const previous = button.textContent;
      button.textContent = success ? "คัดลอกแล้ว" : "คัดลอกไม่สำเร็จ";
      window.setTimeout(() => { button.textContent = previous; }, 1600);
    }

      return button;
    }

    function createGeminiOutputPage(page) {
      const panel = document.createElement("section");
      panel.className = "gemini-output-panel";

      const copy = document.createElement("div");
      copy.className = "gemini-output-copy";
      const kicker = document.createElement("p");
      kicker.className = "gemini-output-kicker";
      kicker.textContent = "Gemini Notebook Output";
      const heading = document.createElement("h3");
      heading.textContent = page.heading;
      const intro = document.createElement("p");
      intro.textContent = page.intro;
      const points = document.createElement("ul");
      points.className = "gemini-output-points";
      page.points.forEach(text => {
        const point = document.createElement("li");
        point.textContent = text;
        points.append(point);
      });
      copy.append(kicker, heading, intro, points);

      const media = document.createElement("div");
      media.className = "gemini-output-media";
      const source = page.media;
      if (source.kind === "image") {
        const image = document.createElement("img");
        image.src = source.src;
        image.alt = source.alt;
        if (source.href) {
          const link = document.createElement("a");
          link.href = source.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.setAttribute("aria-label", `เปิด ${source.alt}`);
          link.append(image);
          media.append(link);
        } else {
          media.append(image);
        }
      } else if (source.kind === "audio") {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = source.src;
        audio.setAttribute("aria-label", source.label);
        media.append(audio);
      } else if (source.kind === "video") {
        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.src = source.src;
        video.poster = source.poster;
        video.setAttribute("aria-label", source.label);
        media.append(video);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "gemini-output-placeholder";
        const title = document.createElement("strong");
        title.textContent = source.title;
        const text = document.createElement("span");
        text.textContent = source.text;
        placeholder.append(title, text);
        media.append(placeholder);
      }

      panel.append(copy, media);
      return panel;
    }

    // The embedded deck forwards arrow keys, Escape and in-deck jump buttons so the lesson viewer stays in sync.
    window.addEventListener("message", event => {
      if (activeLesson !== "html-presentation") return;
      if (event.source !== document.getElementById("htmlDeckFrame")?.contentWindow) return;
      if (event.data?.type === "html-deck-close") closeLesson();

    function showLessonContent(page) {
      lessonContent.replaceChildren();
      lessonContent.classList.toggle("balanced-content", page.type === "extension-usecase");
      lessonContent.classList.toggle("notebook-content", page.type === "extension-usecase" || page.type === "gemini-output" || page.type === "gemini-link");
      lessonContent.classList.toggle("refinement-explainer-page", page.type === "refinement-explainer");

      if (page.type === "prompt-library") lessonContent.append(createPromptLibrary());
      if (page.type === "refinement-explainer") lessonContent.append(createRefinementExplainer());
      if (page.type === "refinement-prompt") lessonContent.append(createRefinementPrompt());
      if (page.type === "workshop-skill-link") lessonContent.append(createWorkshopSkillLink());
      if (page.type === "gemini-link") lessonContent.append(createGeminiLink());
      if (page.type === "gemini-output") lessonContent.append(createGeminiOutputPage(page));
      if (page.type === "tools-lobby") lessonContent.append(createToolsLobbyPage(page));
      if (page.type === "extension-usecase") lessonContent.append(createExtensionUsecasePage(page));

        lessonContent.classList.add("install-videos-content");

      }
      if (page.type === "recap-video") {

      }
      if (page.type === "profile-site") {
        lessonContent.classList.add("profile-site-content");
        lessonContent.append(createProfileSitePage(page));
      }
      if (page.type === "html-deck") {
        lessonContent.classList.add("profile-site-content");
        lessonContent.append(createHtmlDeckPage(page));
      }
      if (page.type === "agent-usecases") {
        lessonContent.classList.add("agent-usecases-content");
        lessonContent.append(window.createAgentUsecasePage(page, createCopyButton));
      }
      if (page.type.startsWith("dashboard-")) {
        lessonContent.classList.add("dashboard-content");

      lessonContent.hidden = false;
      slideFrame.classList.add("content-page");
      if (page.type === "agent-usecases") lessonContent.scrollTop = 0;
      if (page.type.startsWith("dashboard-")) lessonContent.scrollTop = 0;
    }

    function clearLessonVideo() {
      lessonVideo.pause();
      lessonVideo.removeAttribute("src");
      lessonVideo.load();
      lessonVideo.hidden = true;
      closeVideo.hidden = true;
    }

    function clearLessonContent() {
      lessonContent.replaceChildren();
      lessonContent.hidden = true;
      lessonContent.classList.remove("balanced-content");
      lessonContent.classList.remove("refinement-explainer-page");
      lessonContent.classList.remove("agent-usecases-content");
      lessonContent.classList.remove("dashboard-content");
      lessonContent.classList.remove("profile-site-content");
      lessonContent.classList.remove("install-videos-content");
      lessonContent.classList.remove("recap-video-content");
      slideFrame.classList.remove("content-page");
    }

    function startOverlayVideo(file) {
      lessonVideo.pause();
      lessonVideo.muted = true;
      lessonVideo.defaultMuted = true;
      lessonVideo.src = videoPath(file);
      lessonVideo.setAttribute("aria-label", `${lessons[activeLesson].title} วิดีโอประกอบสไลด์ ${activeIndex + 1}`);
      lessonVideo.hidden = false;
      closeVideo.hidden = false;
      lessonVideo.play().catch(() => {});
    }

    function openLesson(key, updateHash = true) {
      const lesson = lessons[key];
      if (!lesson) return;
      activeLesson = key;
      activeIndex = 0;
      viewerTitle.textContent = lesson.title;
      const pages = lessonPages(lesson);
      thumbnailBar.replaceChildren(...pages.map((page, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb";
        const pageLabel = page.type === "slide" ? `สไลด์หน้า ${page.page}` : page.label;
        button.setAttribute("aria-label", `เปิด ${pageLabel}`);
        if (page.type === "slide") {
          const image = document.createElement("img");
          image.src = thumbPath(page);
          image.alt = `ตัวอย่างสไลด์หน้า ${page.page}`;
          button.append(image);
          if (!page.motion && page.assetSet === "basic-rag" && page.page >= 62 && page.page <= 69) button.classList.add("legacy-restyled-thumb");
        } else if (page.type === "recap-video") {
          const image = document.createElement("img");
          image.src = videoPath(`recap/${page.file}-poster.jpg`);
          image.alt = "ตัวอย่างคลิปสรุปเนื้อหา";
          button.append(image);
        } else if (lesson.contentThumbDir) {
          // Content pages (not slides) get a rendered picture of the page, built by scripts/build-content-thumbs.js
          const image = document.createElement("img");
          image.src = `assets/motion/${lesson.contentThumbDir}/thumbs/content-${String(index + 1).padStart(2, "0")}.jpg?rev=${motionAssetRevision}`;
          image.alt = `ตัวอย่างหน้า ${page.label}`;
          button.append(image);
        } else {
          const label = document.createElement("span");
          label.className = "thumb-label";
          label.textContent = page.label;
          button.append(label);
        }
        button.addEventListener("click", () => showSlide(index));
        return button;
      }));
      viewer.hidden = false;
      document.body.classList.add("viewer-open");
      showSlide(0);
      document.getElementById("closeViewer").focus({preventScroll: true});
      if (updateHash) history.pushState({lesson:key}, "", `#${key}`);
    }

    function closeLesson(updateHash = true) {
      if (document.fullscreenElement === viewer) document.exitFullscreen();
      closeSlidePicker(false);
      viewer.hidden = true;
      document.body.classList.remove("viewer-open");
      const lastLesson = activeLesson;
      clearLessonVideo();
      clearLessonContent();
      showSlideMotion({}, "");
      activeLesson = null;
      if (updateHash) history.pushState({}, "", location.pathname);
      document.querySelector(`[data-lesson="${lastLesson}"]`)?.focus({preventScroll:true});
    }

    function pageLabel(page) {
      return page.type === "slide" ? `สไลด์หน้า ${page.page}` : page.label;
    }

    function renderSlidePicker() {
      const lesson = lessons[activeLesson];
      if (!lesson) return;
      const pages = lessonPages(lesson);
      slidePickerGrid.replaceChildren(...pages.map((page, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "slide-picker-item";
        button.setAttribute("aria-label", `เปิด ${pageLabel(page)}`);
        if (page.type === "slide" || page.type === "recap-video") {
          const image = document.createElement("img");
          image.src = page.type === "slide" ? thumbPath(page) : videoPath(`recap/${page.file}-poster.jpg`);
          image.alt = "";
          button.append(image);
        } else {
          const label = document.createElement("span");
          label.className = "slide-picker-item-label";
          label.textContent = page.label;
          button.append(label);
        }
        const number = document.createElement("span");
        number.className = "slide-picker-index";
        number.textContent = String(index + 1).padStart(2, "0");
        button.append(number);
        button.addEventListener("click", () => {
          showSlide(index);
          closeSlidePicker();
        });
        return button;
      }));
      syncSlidePickerSelection();
    }

    function syncSlidePickerSelection() {
      [...slidePickerGrid.children].forEach((item, index) => {
        item.classList.toggle("active", index === activeIndex);
        item.setAttribute("aria-current", index === activeIndex ? "true" : "false");
      });
    }

    function openSlidePickerDialog() {
      if (!activeLesson) return;
      if (activeLesson === "dashboard") {
        window.dispatchEvent(new CustomEvent("dashboard-page", {detail: {index:0,section:"menus"}}));
        return;
      }
      renderSlidePicker();
      slidePicker.hidden = false;
      closeSlidePickerButton.focus({preventScroll:true});
    }

    function closeSlidePicker(restoreFocus = true) {
      if (slidePicker.hidden) return;
      slidePicker.hidden = true;
      if (restoreFocus && activeLesson) openSlidePicker.focus({preventScroll:true});
    }

    function showSlide(index) {
      if (!activeLesson) return;
      const lesson = lessons[activeLesson];
      const pages = lessonPages(lesson);
      if (index < 0 || index >= pages.length) return;
      activeIndex = index;
      const page = pages[index];
      clearLessonVideo();
      clearLessonContent();
      const isLegacyRestyled = page.type === "slide" && !page.motion && page.assetSet === "basic-rag" && page.page >= 62 && page.page <= 69;
      slideFrame.classList.toggle("legacy-restyled", isLegacyRestyled);
      const skillNumber = activeLesson === "give-skill" && page.type === "slide" && !page.motion ? giveSkillSequenceByPage.get(page.page) : null;
      skillSequenceNumber.hidden = !skillNumber;
      skillSequenceNumber.textContent = skillNumber ?? "";
      geminiExtensionOverlay.hidden = !(activeLesson === "gemini-notebook" && page.type === "slide" && page.page === 220);
      slideImage.hidden = page.type !== "slide" || Boolean(page.motion);
      showSlideMotion(page, `${lesson.title} สไลด์หน้า ${page.page}`);
      if (page.type === "slide") {
        slideImage.src = slidePath(page.page, page.assetSet);
        slideImage.alt = `${lesson.title} สไลด์หน้า ${page.page}`;
        requestAnimationFrame(positionSkillSequenceNumber);
      } else {
        showLessonContent(page);
      }
      const videoFile = page.type === "slide" ? lesson.videoByPage?.[page.page] : null;
      playVideo.hidden = true;
      if (videoFile) startOverlayVideo(videoFile);
      const resource = page.type === "slide" ? lesson.resources?.[page.page] : null;
      const resources = resource ? (Array.isArray(resource) ? resource : [resource]) : [];
      const buttonResources = resources.filter(item => !item.imageOnly);
      slideResource.hidden = buttonResources.length === 0;
      slideResource.replaceChildren(...buttonResources.map(item => {
        const link = document.createElement("a");
        link.className = "slide-resource-link";
        if (item.prominent) link.classList.add("llm-demo-link");
        link.href = item.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.label;
        return link;
      }));
      const imageResource = resources.find(item => item.imageLink);
      slideImageResourceLink.hidden = !imageResource;
      slideImageResourceLink.style.inset = imageResource?.imageLinkArea ? "auto" : "";
      for (const side of ["left", "top", "width", "height"]) {
        slideImageResourceLink.style[side] = imageResource?.imageLinkArea?.[side] ?? "";
      }
      if (imageResource) {
        slideImageResourceLink.href = imageResource.href;
        slideImageResourceLink.setAttribute("aria-label", `${imageResource.label} (เปิดในแท็บใหม่)`);
      } else {
        slideImageResourceLink.removeAttribute("href");
        slideImageResourceLink.removeAttribute("aria-label");
      }
      viewerProgress.textContent = activeLesson === "dashboard" && pages[index].type !== "recap-video" ? (pages[index].type === "dashboard-chart" ? `กราฟ ${pages[index].number} / 21` : "เลือกตามคำถามของคุณ") : `สไลด์ ${index + 1} / ${pages.length}`;
      openSlidePicker.textContent = activeLesson === "dashboard" ? "คลังกราฟ" : "สไลด์";
      openSlidePicker.setAttribute("aria-haspopup", activeLesson === "dashboard" ? "false" : "dialog");
      const isDashboardChart = activeLesson === "dashboard" && pages[index].type === "dashboard-chart";
      prevSlide.disabled = index === 0 || (isDashboardChart && pages[index - 1]?.type !== "dashboard-chart");
      nextSlide.disabled = index === pages.length - 1 || (isDashboardChart && pages[index + 1]?.type !== "dashboard-chart");
      [...thumbnailBar.children].forEach((thumb, thumbIndex) => {
        thumb.classList.toggle("active", thumbIndex === index);
        thumb.setAttribute("aria-current", thumbIndex === index ? "true" : "false");
      });
      syncSlidePickerSelection();
      thumbnailBar.children[index]?.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
      const nextPage = pages[index + 1];
      if (nextPage?.type === "slide") new Image().src = slidePath(nextPage.page, nextPage.assetSet);
    }

    playVideo.addEventListener("click", () => {
      const lesson = lessons[activeLesson];
      const page = lesson ? lessonPages(lesson)[activeIndex] : null;
      const file = page?.type === "slide" ? lesson?.videoByPage?.[page.page] : null;
      if (!file) return;
      lessonVideo.setAttribute("aria-label", `${lesson.title} วิดีโอประกอบสไลด์ ${activeIndex + 1}`);
      playVideo.hidden = true;
      startOverlayVideo(file);
    });

    closeVideo.addEventListener("click", () => {
      clearLessonVideo();
      const lesson = lessons[activeLesson];
      const page = lesson ? lessonPages(lesson)[activeIndex] : null;
      playVideo.hidden = !(page?.type === "slide" && lesson?.videoByPage?.[page.page]);
    });

    document.querySelectorAll("[data-lesson]").forEach(button => {
      button.addEventListener("click", () => openLesson(button.dataset.lesson));
    });
    window.addEventListener("dashboard-page", event => {
      if (activeLesson !== "dashboard") return;
      const index = event.detail && typeof event.detail === "object" ? event.detail.index : event.detail;
      if (!Number.isInteger(index)) return;
      showSlide(index);
      if (event.detail?.section === "menus") {
        const heading = lessonContent.querySelector("#dashboardChartMenus");
        heading?.focus({preventScroll:true});
        heading?.scrollIntoView({block:"start"});
      }
    });

    document.getElementById("closeViewer").addEventListener("click", () => closeLesson());
    openSlidePicker.addEventListener("click", openSlidePickerDialog);
    closeSlidePickerButton.addEventListener("click", () => closeSlidePicker());
    slidePicker.addEventListener("click", event => {
      if (event.target === slidePicker) closeSlidePicker();
    });
    function syncFullscreenButton() {
      const isFullscreen = document.fullscreenElement === viewer;
      toggleFullscreen.textContent = isFullscreen ? "ออกจากเต็มหน้าจอ" : "เต็มหน้าจอ";
      toggleFullscreen.setAttribute("aria-pressed", String(isFullscreen));
    }

    toggleFullscreen.addEventListener("click", () => {
      if (document.fullscreenElement === viewer) document.exitFullscreen();
      else viewer.requestFullscreen?.().catch(() => {});
    });
    document.addEventListener("fullscreenchange", syncFullscreenButton);
    prevSlide.addEventListener("click", () => showSlide(activeIndex - 1));
    nextSlide.addEventListener("click", () => showSlide(activeIndex + 1));

    document.addEventListener("keydown", event => {
      if (!activeLesson) return;
      if (document.querySelector(".dash-zoom[open]")) return;
      if (!slidePicker.hidden) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeSlidePicker();
        } else if (event.key === "Tab") {
          const focusable = [closeSlidePickerButton, ...slidePickerGrid.querySelectorAll("button")];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          } else if (!slidePicker.contains(document.activeElement)) {
            event.preventDefault();
            first.focus();
          }
        }
        return;
      }
      if (event.key === "Escape") {
        if (document.fullscreenElement === viewer) {
          document.exitFullscreen();
          return;
        }
        closeLesson();
      }
      const editingAgentData = event.target.closest?.(".agent-page, .dash-page") && event.target.matches("select, input, textarea, [contenteditable]");
      // Arrow keys on a focused video seek inside the clip; don't also change the slide
      if (event.target.closest?.("video, audio") && ["ArrowLeft", "ArrowRight"].includes(event.key)) return;
      if (!editingAgentData && activeLesson === "dashboard" && lessons.dashboard.pages[activeIndex]?.type === "dashboard-chart" && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        const index = activeIndex + (event.key === "ArrowRight" ? 1 : -1);
        if (lessons.dashboard.pages[index]?.type === "dashboard-chart") window.dispatchEvent(new CustomEvent("dashboard-page", {detail:index}));
        return;
      }
      if (!editingAgentData && event.key === "ArrowLeft") showSlide(activeIndex - 1);
      if (!editingAgentData && event.key === "ArrowRight") showSlide(activeIndex + 1);
    });

    slideStage.addEventListener("pointerdown", event => {
      pointerStartX = event.target.closest(".agent-page, .dash-page") ? null : event.clientX;
    });
    slideStage.addEventListener("pointerup", event => {
      if (pointerStartX === null) return;
      const distance = event.clientX - pointerStartX;
      pointerStartX = null;
      if (Math.abs(distance) < 55) return;
      showSlide(activeIndex + (distance < 0 ? 1 : -1));
    });

    window.addEventListener("popstate", () => {
      const key = location.hash.slice(1);
      if (lessons[key]) openLesson(key, false);
      else if (activeLesson) closeLesson(false);
    });

    const requestedLesson = location.hash.slice(1);
    if (lessons[requestedLesson]) openLesson(requestedLesson, false);
  </script>
